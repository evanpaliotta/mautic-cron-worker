[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:cron]
command=/usr/sbin/cron -f -L 15
autostart=true
autorestart=true
startretries=10
startsecs=5
; Redirect cron output to stdout/stderr so Railway can see it
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:db-watchdog]
; Database connectivity watchdog - checks every 60 seconds
; If DB is unreachable for 3 consecutive checks, logs warning
command=/bin/bash -c 'while true; do sleep 60; if ! /usr/local/bin/check-db.sh 3 2 >/dev/null 2>&1; then echo "[$(date +\"%%Y-%%m-%%d %%H:%%M:%%S\")] DB-WATCHDOG: Database unreachable - cron jobs will retry on next run" >/proc/1/fd/1; fi; done'
autostart=true
autorestart=true
startretries=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:keepalive]
; Keeps a lightweight database connection alive every 30 seconds
; This prevents MySQL from closing idle connections
command=/bin/bash -c 'while true; do sleep 30; source /etc/mautic-env 2>/dev/null; php -r "try { \$pdo = new PDO(\"mysql:host=\".getenv(\"MAUTIC_DB_HOST\").\";port=\".getenv(\"MAUTIC_DB_PORT\").\";dbname=\".getenv(\"MAUTIC_DB_NAME\"), getenv(\"MAUTIC_DB_USER\"), getenv(\"MAUTIC_DB_PASSWORD\"), [PDO::ATTR_TIMEOUT=>5]); \$pdo->query(\"SELECT 1\"); } catch(Exception \$e) {}" 2>/dev/null; done'
autostart=true
autorestart=true
startretries=999
stdout_logfile=/dev/null
stderr_logfile=/dev/null
