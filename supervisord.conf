[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:cron]
command=/usr/sbin/cron -f -L 15
autostart=true
autorestart=true
; Redirect cron output to stdout/stderr so Railway can see it
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
